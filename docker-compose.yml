name: service-manager

# Cấu hình chung cho các container chạy mã nguồn PHP.
x-php: &php
  build:
    context: .
    dockerfile: Dockerfile
  image: service-manager-php
  restart: unless-stopped
  volumes:
    - .:/var/www/html
  networks:
    - internal

services:
  app:
    <<: *php
    environment:
      CONTAINER_ROLE: app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # File này được tạo khi entrypoint chuẩn bị xong (composer, migration...).
      test: ["CMD-SHELL", "test -f /tmp/app-ready"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 900s

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - internal

  queue:
    <<: *php
    user: www-data
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
    environment:
      CONTAINER_ROLE: queue
    depends_on:
      app:
        condition: service_healthy

  scheduler:
    <<: *php
    user: www-data
    command: php artisan schedule:work
    environment:
      CONTAINER_ROLE: scheduler
    depends_on:
      app:
        condition: service_healthy

  # PostgreSQL và Redis không mở cổng ra ngoài: chỉ các container trong mạng
  # "internal" truy cập được.
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-service_manager}
      POSTGRES_USER: ${DB_USERNAME:-service_manager}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
      TZ: Asia/Ho_Chi_Minh
      PGTZ: Asia/Ho_Chi_Minh
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - internal

networks:
  internal:

volumes:
  postgres_data:
  redis_data:
