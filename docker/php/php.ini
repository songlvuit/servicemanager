; Cấu hình PHP cho ứng dụng
date.timezone = Asia/Ho_Chi_Minh
expose_php = Off
memory_limit = 256M
max_execution_time = 60

; Upload: mặc định 20MB/file (mục 53 của yêu cầu). Khi đổi, sửa cả
; client_max_body_size trong docker/nginx/default.conf.
upload_max_filesize = 20M
post_max_size = 25M

realpath_cache_size = 4096K
realpath_cache_ttl = 600

opcache.enable = 1
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
; Mã nguồn được mount từ máy chủ nên luôn kiểm tra thay đổi của file.
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
