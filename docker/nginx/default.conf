server {
    listen 80 default_server;
    server_name _;

    root /var/www/html/public;
    index index.php;
    charset utf-8;
    server_tokens off;

    # Giới hạn upload: 20MB/file + phần dư cho form.
    client_max_body_size 25m;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # DNS nội bộ của Docker: phân giải lại "app" khi container được tạo lại,
    # tránh lỗi 502 do Nginx giữ IP cũ.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # File tĩnh có thật thì cache; không có thì chuyển cho Laravel
    # (ví dụ /livewire/livewire.js do PHP phục vụ).
    location ~* \.(?:css|js|mjs|map|woff2?|ttf|png|jpe?g|gif|svg|webp|ico)$ {
        try_files $uri /index.php?$query_string;
        expires 7d;
        access_log off;
    }

    location = /index.php {
        set $php_upstream app:9000;
        fastcgi_pass $php_upstream;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_read_timeout 120s;
        fastcgi_buffer_size 32k;
        fastcgi_buffers 16 16k;
    }

    # Không cho chạy trực tiếp file PHP nào khác.
    location ~ \.php$ {
        return 404;
    }

    # Chặn file ẩn (.env, .git, ...).
    location ~ /\.(?!well-known) {
        deny all;
    }
}
